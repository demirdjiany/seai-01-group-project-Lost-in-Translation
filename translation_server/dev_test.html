<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lost in Translation — Dev Test</title>
<style>
    body {
        font-family: system-ui, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
        background: #fafafa;
    }
    h1 { font-size: 1.4rem; }
    .note {
        background: #fff3cd;
        border: 1px solid #f0d878;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 0.85rem;
        margin-bottom: 20px;
    }
    button {
        cursor: pointer;
        border: 1px solid #999;
        background: #fff;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 0.95rem;
    }
    button:hover { background: #eee; }
    #status { color: #555; margin: 10px 0; min-height: 1.2em; }
    #mangled {
        font-size: 1.3rem;
        font-weight: bold;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
        margin: 10px 0;
        min-height: 1.4em;
    }
    #timer { font-size: 0.85rem; color: #888; }
    .row { display: flex; gap: 8px; margin: 10px 0; }
    .row input {
        flex: 1;
        padding: 8px;
        font-size: 0.95rem;
        border: 1px solid #999;
        border-radius: 6px;
    }
    #guess-result, #hint-result { font-size: 0.9rem; margin-top: 4px; }
    #reveal {
        margin-top: 20px;
        border-top: 1px solid #ddd;
        padding-top: 16px;
    }
    .reveal-row {
        display: grid;
        grid-template-columns: 70px 1fr 90px;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px dashed #ddd;
        font-size: 0.9rem;
        opacity: 0;
        animation: fadeIn 0.4s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    .reveal-row .lang { font-weight: bold; color: #555; }
    .reveal-row .delta { text-align: right; color: #888; }
    #player-label { font-size: 0.8rem; color: #888; margin-bottom: 10px; }
    #hof-list { margin-top: 10px; }
    .hof-row {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 10px;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid #eee;
        font-size: 0.85rem;
    }
</style>
</head>
<body>

<div class="note">Developer test page for the translation service + round lifecycle. Not the real game UI — Student C builds that.</div>

<h1>Lost in Translation — Dev Test</h1>
<div id="player-label">Setting up player…</div>

<button id="btn-new-round" onclick="newRound()">New Round</button>
<a href="#" id="btn-peek" onclick="peekAnswer(); return false;" style="margin-left:10px; font-size:0.85rem; color:#a33;">👀 peek answer (dev only)</a>
<div id="status"></div>

<div id="mangled">—</div>
<div id="timer"></div>
<div id="peek-result" style="font-size:0.85rem; color:#a33;"></div>

<div class="row">
    <input id="guess-input" type="text" placeholder="Guess the original sentence" onkeydown="if(event.key==='Enter') submitGuess()">
    <button id="btn-guess" onclick="submitGuess()">Guess</button>
    <button id="btn-hint" onclick="useHint()">Hint</button>
</div>
<div id="guess-result"></div>
<div id="hint-result"></div>

<div id="reveal" style="display:none">
    <strong>Original:</strong> <span id="original"></span><br>
    <strong id="score"></strong>
    <div id="reveal-steps"></div>
</div>

<div style="margin-top:30px; border-top:1px solid #ddd; padding-top:16px;">
    <button id="btn-hof-score" onclick="loadHallOfFame('score')">Hall of Fame (by score)</button>
    <button id="btn-hof-votes" onclick="loadHallOfFame('votes')">Hall of Fame (by votes)</button>
    <div id="hof-list"></div>
</div>

<script>
let playerId = null;
let username = null;
let currentRoundId = null;
let pollTimer = null;
let hasRevealed = false;

async function getJson(url) {
    const r = await fetch(url);
    return r.json();
}

async function postForm(url, data) {
    const r = await fetch(url, { method: "POST", body: new URLSearchParams(data) });
    return r.json();
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

async function ensurePlayer() {
    let specialId = localStorage.getItem("special_id");

    if (!specialId) {
        specialId = String(Date.now() % 1000000);
        localStorage.setItem("special_id", specialId);
        await postForm("API/users/add_user.php", { special_id: specialId });
    }

    const res = await getJson("API/users/get_user.php?special_id=" + specialId);
    if (res.success && res.data) {
        playerId = res.data.id;
        username = res.data.username;
    }

    document.getElementById("player-label").textContent = username ? "Playing as " + username : "Could not set up a player";
}

function setStatus(text) {
    document.getElementById("status").textContent = text;
}

async function peekAnswer() {
    if (!currentRoundId) return;
    const res = await getJson("dev_reveal_seed.php?round_id=" + currentRoundId);
    document.getElementById("peek-result").textContent = res.seed ? "Answer: " + res.seed : "No answer found";
}

async function newRound() {
    clearInterval(pollTimer);
    hasRevealed = false;
    document.getElementById("reveal").style.display = "none";
    document.getElementById("guess-result").textContent = "";
    document.getElementById("hint-result").textContent = "";
    document.getElementById("mangled").textContent = "—";
    document.getElementById("peek-result").textContent = "";
    setStatus("Creating round — running the real 7-hop translation chain, this can take a few seconds…");

    const res = await getJson("API/rounds/create_round.php");
    if (!res.success) {
        setStatus("Failed to create round: " + (res.message || "unknown error"));
        return;
    }

    currentRoundId = res.round_id;
    setStatus("Round #" + currentRoundId + " ready — guess the original sentence!");
    pollRound();
    pollTimer = setInterval(pollRound, 2000);
}

async function pollRound() {
    if (!currentRoundId) return;

    const res = await getJson("API/rounds/get_round.php?round_id=" + currentRoundId);
    if (!res.success) return;

    const data = res.data;
    document.getElementById("mangled").textContent = data.final_translation;
    document.getElementById("timer").textContent = data.status === "open"
        ? data.remaining_seconds + "s left"
        : "round closed";

    if (data.status === "closed" && !hasRevealed) {
        hasRevealed = true;
        clearInterval(pollTimer);
        showReveal(data);
    }
}

function showReveal(data) {
    document.getElementById("reveal").style.display = "block";
    document.getElementById("original").textContent = data.original_sentence;
    document.getElementById("score").textContent = "Mangle score: " + data.score + " / 100";

    const container = document.getElementById("reveal-steps");
    container.innerHTML = "";

    let prevText = data.original_sentence;
    let i = 0;

    function showNext() {
        if (i >= data.steps.length) return;

        const step = data.steps[i];
        const delta = step.translated_text.length - prevText.length;
        const sign = delta > 0 ? "+" : "";

        const row = document.createElement("div");
        row.className = "reveal-row";
        row.innerHTML =
            "<span class='lang'>" + step.from_language + " → " + step.to_language + "</span>" +
            "<span>" + escapeHtml(step.translated_text) + "</span>" +
            "<span class='delta'>" + sign + delta + " chars</span>";

        container.appendChild(row);
        prevText = step.translated_text;
        i++;
        setTimeout(showNext, 1000);
    }

    showNext();
}

async function submitGuess() {
    const guess = document.getElementById("guess-input").value.trim();
    if (!guess || !currentRoundId) return;

    const res = await postForm("API/guesses/add_guess.php", { player_id: playerId, round_id: currentRoundId, guess: guess });
    const out = document.getElementById("guess-result");

    if (!res.success) {
        out.textContent = "Error: " + (res.message || "could not submit guess");
        return;
    }

    out.textContent = res.data.result.toUpperCase() + " — similarity " + res.data.similarity.toFixed(2) + ", score " + res.data.final_score;
}

async function useHint() {
    if (!currentRoundId) return;

    const res = await postForm("API/hints/use_hint.php", { player_id: playerId, round_id: currentRoundId });
    const out = document.getElementById("hint-result");

    if (!res.success) {
        out.textContent = "Error: " + (res.message || "no hint available");
        return;
    }

    const hint = res.data.hint;
    out.textContent = "Hint (step " + hint.step_number + ", " + hint.from_language + "→" + hint.to_language + "): \"" + hint.translated_text + "\" (-" + res.data.points_penalty + " pts total, " + res.data.hints_used + " used)";
}

async function loadHallOfFame(sort) {
    const res = await getJson("API/hall_of_fame/get_entries.php?sort=" + (sort || "score"));
    const list = document.getElementById("hof-list");
    list.innerHTML = "";

    if (!res.success || res.data.length === 0) {
        list.textContent = "No closed rounds yet.";
        return;
    }

    res.data.forEach(function (entry) {
        const row = document.createElement("div");
        row.className = "hof-row";
        row.innerHTML =
            "<span>" + escapeHtml(entry.original_sentence) + " → " + escapeHtml(entry.final_translation) + "</span>" +
            "<span>score " + entry.score + "</span>" +
            "<span>" + entry.votes + " votes</span>" +
            "<button onclick='vote(" + entry.round_id + ")'>Upvote</button>";
        list.appendChild(row);
    });
}

async function vote(roundId) {
    await postForm("API/votes/add_vote.php", { player_id: playerId, round_id: roundId });
    loadHallOfFame();
}

ensurePlayer();
</script>
</body>
</html>
