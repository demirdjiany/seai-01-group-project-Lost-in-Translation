<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Lost in Translation</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌀</text></svg>">
<link rel="stylesheet" href="styles/style.css">
</head>
<body class="auth-page">

<div class="auth-wrap">
  <div class="brand brand-center">
    <span class="brand-mark">🌀</span>
    <span class="brand-name">Lost in Translation</span>
  </div>

  <div class="panel auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="muted auth-sub">Log in to start mangling sentences.</p>

    <form id="login-form" class="auth-form" novalidate>
      <div class="field">
        <label for="login-email">Email</label>
        <input class="input" id="login-email" name="email" type="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input class="input" id="login-password" name="password" type="password" placeholder="••••••••" required minlength="6">
      </div>
      <p id="auth-error" class="field-error" hidden></p>
      <button type="submit" class="btn btn-primary auth-submit">Log in</button>
    </form>

    <p class="auth-switch">New here? <a href="pages/signup.html">Create an account</a></p>
  </div>
</div>

<script src="scripts/axios.min.js"></script>
<script type="module" src="scripts/login.js"></script>
</body>
</html>
